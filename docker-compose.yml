version: "3.9"

services:
  nutri-db:
    image: postgres:16
    container_name: nutri-db
    restart: always
    ports:
      - "5432:5432"  # внешний порт : внутренний порт контейнера
    environment:
      POSTGRES_DB: ${NUTRI_NAME}
      POSTGRES_USER: ${NUTRI_USERNAME}
      POSTGRES_PASSWORD: ${NUTRI_PASSWORD}
    healthcheck:
#      test: [ "CMD", "pg_isready", "-U", "${NUTRI_USERNAME}", "d", "${NUTRI_NAME}"]
#      test: [ "CMD", "pg_isready", "-U", "testuser"]
      test: [
        "CMD-SHELL",
        "pg_isready -U ${NUTRI_USERNAME} -d ${NUTRI_NAME} || exit 0"
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - nutri_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  source-db:
    image: postgres:16
    container_name: source-db
    restart: always
    ports:
      - "5433:5432"  # внешний порт : внутренний порт контейнера
    environment:
      POSTGRES_DB: ${SOURCE_NAME}
      POSTGRES_USER: ${SOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD}
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${SOURCE_USERNAME} -d ${SOURCE_NAME}|| exit 0"
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - source_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
#      - "${BACKEND_PORT}:8080"
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env
    depends_on:
      nutri-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      NUTRI_DB_HOST: ${NUTRI_DB_HOST}
#      NUTRI_PORT: ${NUTRI_PORT}
      NUTRI_NAME: ${NUTRI_NAME}
      NUTRI_USERNAME: ${NUTRI_USERNAME}
      NUTRI_PASSWORD: ${NUTRI_PASSWORD}
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 20s


  data-pipeline:
    build: ./data-pipeline
    container_name: data-pipeline
    restart: always
    ports:
#      - "${DATA_PIPELINE_PORT}:8081"
      - "${DATA_PIPELINE_PORT}:${DATA_PIPELINE_PORT}"
    env_file:
      - .env
    depends_on:
      source-db:
        condition: service_healthy
      nutri-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SOURCE_DB_HOST: ${SOURCE_DB_HOST}
#      SOURCE_PORT: ${SOURCE_PORT}
      SOURCE_NAME: ${SOURCE_NAME}
      SOURCE_USERNAME: ${SOURCE_USERNAME}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GOOGLE_SHEETS_EXPORT_SHEET_NAME: ${GOOGLE_SHEETS_EXPORT_SHEET_NAME}
      SPOONACULAR_BASE_URL: ${SPOONACULAR_BASE_URL}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY}
      SPOONACULAR_SOURCE: ${SPOONACULAR_SOURCE}

  telegram-bot:
    build: ./telegram-bot
    container_name: telegram-bot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./telegram-bot:/app
      - telegram_bot_node_modules:/app/node_modules
    env_file: ./telegram-bot/.env
    command: npm run dev
    depends_on:
      - backend
#        condition: service_healthy
    networks:
      - app-network

volumes:
  nutri_db_data:
  source_db_data:
  telegram_bot_node_modules:

networks:
  app-network:
    driver: bridge
